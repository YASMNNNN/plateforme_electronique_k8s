# =============================================================
#  Alertmanager - Routage des alertes
#  Remplacer les valeurs <...> par tes vraies credentials
# =============================================================

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "default"
    - match:
        alertname: ContainerDown
      receiver: "default"

receivers:
  - name: "default"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]
