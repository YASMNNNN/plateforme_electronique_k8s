services:

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@isetkr.tn
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - plateforme-network

networks:
  plateforme-network:
    external: true
    name: plateforme_electronique_k8s_plateforme-network
