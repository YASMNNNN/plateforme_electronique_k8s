          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy SARIF — signature
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-signature.sarif
          category: trivy-signature
        continue-on-error: true
      - name: Trivy — rapport console signature
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-signature:${{ needs.detect.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ── user-auth-service ──────────────────────────────────────────
  build-userauth:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.userauth == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push user-auth-service
        run: |
          TAG=${{ needs.detect.outputs.image_tag }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/plateforme-userauth:$TAG ./services/user-auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/plateforme-userauth:$TAG
      - name: Trivy — scan userauth (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-userauth:${{ needs.detect.outputs.image_tag }}"
          format: sarif
          output: trivy-userauth.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy SARIF — userauth
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-userauth.sarif
          category: trivy-userauth
        continue-on-error: true
      - name: Trivy — rapport console userauth
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-userauth:${{ needs.detect.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ── frontend ───────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push frontend
        run: |
          TAG=${{ needs.detect.outputs.image_tag }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/plateforme-frontend:$TAG ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/plateforme-frontend:$TAG
      - name: Trivy — scan frontend (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-frontend:${{ needs.detect.outputs.image_tag }}"
          format: sarif
          output: trivy-frontend.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy SARIF — frontend
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
        continue-on-error: true
      - name: Trivy — rapport console frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-frontend:${{ needs.detect.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ═══════════════════════════════════════════════════════════════
  # JOB 2 : SAST — Analyse statique Semgrep (code source)
  # ═══════════════════════════════════════════════════════════════
  sast-code:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.any_rebuild == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/secrets
            p/docker
            p/java
            p/spring-boot
            p/javascript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # JOB 3 : DEPLOY — docker-compose up avec les images pushées
  # Attend que tous les builds soient terminés (succès ou skip)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs:
      - detect
      - build-eureka
      - build-gateway
      - build-invoice
      - build-payment
      - build-subscription
      - build-notification
      - build-signature
      - build-userauth
      - build-frontend
    if: |
      always() &&
      needs.detect.outputs.any_rebuild == 'true' &&
      !contains(needs.*.result, 'failure')
    environment: testing
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Patch docker-compose.yml — injecter les tags d'image
        env:
          TAG: ${{ needs.detect.outputs.image_tag }}
          HUB: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Remplacer les directives build: par image: pour utiliser les images pushées
          cat docker-compose.yml | \
          sed "s|build:\n.*context: ./services/eureka-server|image: ${HUB}/plateforme-eureka:${TAG}|g" \
          > docker-compose.deploy.yml

          # Approche plus robuste avec Python
          python3 - <<'EOF'
          import yaml, os, sys

          TAG = os.environ['TAG']
          HUB = os.environ['HUB']

          SERVICE_MAP = {
            'eureka-server':       f'{HUB}/plateforme-eureka:{TAG}',
            'api-gateway':         f'{HUB}/plateforme-gateway:{TAG}',
            'invoice-service':     f'{HUB}/plateforme-invoice:{TAG}',
            'payment-service':     f'{HUB}/plateforme-payment:{TAG}',
            'subscription-service':f'{HUB}/plateforme-subscription:{TAG}',
            'notification-service':f'{HUB}/plateforme-notification:{TAG}',
            'signature-service':   f'{HUB}/plateforme-signature:{TAG}',
            'user-auth-service':   f'{HUB}/plateforme-userauth:{TAG}',
            'frontend':            f'{HUB}/plateforme-frontend:{TAG}',
          }

          with open('docker-compose.yml') as f:
            compose = yaml.safe_load(f)

          for svc_name, image_ref in SERVICE_MAP.items():
            if svc_name in compose.get('services', {}):
              svc = compose['services'][svc_name]
              if 'build' in svc:
                del svc['build']
              svc['image'] = image_ref

          with open('docker-compose.deploy.yml', 'w') as f:
            yaml.dump(compose, f, default_flow_style=False)

          print("docker-compose.deploy.yml généré :")
          for k,v in SERVICE_MAP.items():
            print(f"  {k} → {v}")
          EOF

      - name: Deploy — docker-compose up
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          echo "Déploiement avec le tag : ${{ needs.detect.outputs.image_tag }}"
          docker-compose -f docker-compose.deploy.yml pull
          docker-compose -f docker-compose.deploy.yml up -d
          sleep 20

      - name: Verify containers
        run: docker-compose -f docker-compose.deploy.yml ps

      - name: Wait for services to be ready
        run: |
          echo "Attente API Gateway (port 8080)..."
          for i in $(seq 1 20); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -qE "^(200|301|302|401|403|404)"; then
              echo "✔ API Gateway accessible (tentative $i)"
              break
            fi
            echo "Tentative $i/20 — port 8080 pas encore prêt..."
            sleep 5
          done

          echo "Attente Frontend (port 3000)..."
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -qE "^(200|301|302)"; then
              echo "✔ Frontend accessible (tentative $i)"
              break
            fi
            echo "Tentative $i/15 — port 3000 pas encore prêt..."
            sleep 5
          done

      - name: Deploy summary
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  Plateforme déployée — tag : ${{ needs.detect.outputs.image_tag }}"
          echo "  API Gateway  → http://localhost:8080"
          echo "  Frontend     → http://localhost:3000"
          echo "══════════════════════════════════════════════════════"

  # ═══════════════════════════════════════════════════════════════
  # JOB 4 : DAST — OWASP ZAP Baseline Scan (port 8080 + 3000)
  # ═══════════════════════════════════════════════════════════════
  dast-zap-baseline:
    runs-on: ubuntu-latest
    needs:
      - detect
      - build-eureka
      - build-gateway
      - build-invoice
      - build-payment
      - build-subscription
      - build-notification
      - build-signature
      - build-userauth
      - build-frontend
    if: |
      always() &&
      needs.detect.outputs.any_rebuild == 'true' &&
      !contains(needs.*.result, 'failure')
    environment: testing
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Start stack for DAST
        env:
          TAG: ${{ needs.detect.outputs.image_tag }}
          HUB: ${{ secrets.DOCKER_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import yaml, os
          TAG=os.environ['TAG']; HUB=os.environ['HUB']
          SERVICE_MAP = {
            'eureka-server':f'{HUB}/plateforme-eureka:{TAG}',
            'api-gateway':f'{HUB}/plateforme-gateway:{TAG}',
            'invoice-service':f'{HUB}/plateforme-invoice:{TAG}',
            'payment-service':f'{HUB}/plateforme-payment:{TAG}',
            'subscription-service':f'{HUB}/plateforme-subscription:{TAG}',
            'notification-service':f'{HUB}/plateforme-notification:{TAG}',
            'signature-service':f'{HUB}/plateforme-signature:{TAG}',
            'user-auth-service':f'{HUB}/plateforme-userauth:{TAG}',
            'frontend':f'{HUB}/plateforme-frontend:{TAG}',
          }
          with open('docker-compose.yml') as f:
            c=yaml.safe_load(f)
          for k,v in SERVICE_MAP.items():
            if k in c.get('services',{}):
              s=c['services'][k]
              if 'build' in s: del s['build']
              s['image']=v
          with open('docker-compose.deploy.yml','w') as f:
            yaml.dump(c,f,default_flow_style=False)
          EOF
          docker-compose -f docker-compose.deploy.yml pull
          docker-compose -f docker-compose.deploy.yml up -d
          echo "Stack démarrée — attente 30s..."
          sleep 30

      - name: Wait for API Gateway (8080)
        run: |
          for i in $(seq 1 20); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -qE "^(200|301|302|401|403|404)"; then
              echo "✔ API Gateway prêt"; break
            fi
            echo "Tentative $i/20..."; sleep 5
          done

      - name: Wait for Frontend (3000)
        run: |
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -qE "^(200|301|302)"; then
              echo "✔ Frontend prêt"; break
            fi
            echo "Tentative $i/15..."; sleep 5
          done

      - name: OWASP ZAP — Baseline Scan API Gateway (8080)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-I"
          artifact_name: "zap-baseline-gateway"
        continue-on-error: true

      - name: Upload ZAP Baseline report — Gateway
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report-gateway
          path: report_html.html
          retention-days: 7

      - name: OWASP ZAP — Baseline Scan Frontend (3000)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-I"
          artifact_name: "zap-baseline-frontend"
        continue-on-error: true

      - name: Upload ZAP Baseline report — Frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report-frontend
          path: report_html.html
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # JOB 5 : DAST — OWASP ZAP Full Scan (port 8080 + 3000)
  # ═══════════════════════════════════════════════════════════════
  dast-zap-full:
    runs-on: ubuntu-latest
    needs:
      - detect
      - dast-zap-baseline
