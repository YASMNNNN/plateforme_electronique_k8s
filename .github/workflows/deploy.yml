name: CI/CD — Plateforme Électronique de Paiement

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  security-events: write
  issues: write

# ─────────────────────────────────────────────────────────────────
# Liste des services buildables (dossier → nom image DockerHub)
# ─────────────────────────────────────────────────────────────────
# services/eureka-server   → yassmineg/plateforme-eureka
# services/api-gateway     → yassmineg/plateforme-gateway
# services/invoice-service → yassmineg/plateforme-invoice
# services/payment-service → yassmineg/plateforme-payment
# services/subscription-service → yassmineg/plateforme-subscription
# services/notification-service → yassmineg/plateforme-notification
# services/signature-service    → yassmineg/plateforme-signature
# services/user-auth-service    → yassmineg/plateforme-userauth
# frontend/                → yassmineg/plateforme-frontend
# ─────────────────────────────────────────────────────────────────

jobs:

  # ═══════════════════════════════════════════════════════════════
  # JOB 0 : DETECT — Détection fine des changements par service
  # ═══════════════════════════════════════════════════════════════
  detect:
    runs-on: ubuntu-latest
    outputs:
      image_tag:          ${{ steps.tag.outputs.image_tag }}
      eureka:             ${{ steps.changes.outputs.eureka }}
      gateway:            ${{ steps.changes.outputs.gateway }}
      invoice:            ${{ steps.changes.outputs.invoice }}
      payment:            ${{ steps.changes.outputs.payment }}
      subscription:       ${{ steps.changes.outputs.subscription }}
      notification:       ${{ steps.changes.outputs.notification }}
      signature:          ${{ steps.changes.outputs.signature }}
      userauth:           ${{ steps.changes.outputs.userauth }}
      frontend:           ${{ steps.changes.outputs.frontend }}
      any_rebuild:        ${{ steps.changes.outputs.any_rebuild }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compute SHORT_SHA tag
        id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "image_tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Tag généré : $SHORT_SHA"

      - name: Detect per-service changes
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # Premier commit → tout rebuilder
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "➜ Premier commit → rebuild complet"
            for svc in eureka gateway invoice payment subscription notification signature userauth frontend; do
              echo "${svc}=true" >> $GITHUB_OUTPUT
            done
            echo "any_rebuild=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only $BEFORE $AFTER)
          echo "Fichiers modifiés :"
          echo "$CHANGED"

          ANY=false
          detect() {
            local key=$1; local pattern=$2
            if echo "$CHANGED" | grep -qE "^${pattern}"; then
              echo "${key}=true"  >> $GITHUB_OUTPUT
              echo "  ✔ ${key} modifié"
              ANY=true
            else
              echo "${key}=false" >> $GITHUB_OUTPUT
            fi
          }

          detect eureka        "services/eureka-server/"
          detect gateway       "services/api-gateway/"
          detect invoice       "services/invoice-service/"
          detect payment       "services/payment-service/"
          detect subscription  "services/subscription-service/"
          detect notification  "services/notification-service/"
          detect signature     "services/signature-service/"
          detect userauth      "services/user-auth-service/"
          detect frontend      "frontend/"

          if [ "$ANY" = "true" ]; then
            echo "any_rebuild=true"  >> $GITHUB_OUTPUT
            echo "➜ Au moins un service modifié → pipeline activé"
          else
            echo "any_rebuild=false" >> $GITHUB_OUTPUT
            echo "➜ Aucun changement pertinent → pipeline ignoré"
          fi

  # ═══════════════════════════════════════════════════════════════
  # JOB 1 : BUILD & PUSH — Parallèle par service (conditionnel)
  # Chaque service : build → push → Trivy scan (SARIF + console)
  # ═══════════════════════════════════════════════════════════════

  # ── eureka-server ──────────────────────────────────────────────
  build-eureka:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.eureka == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push eureka-server
        run: |
          TAG=${{ needs.detect.outputs.image_tag }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/plateforme-eureka:$TAG ./services/eureka-server
          docker push ${{ secrets.DOCKER_USERNAME }}/plateforme-eureka:$TAG
          echo "✔ plateforme-eureka:$TAG poussé"
      - name: Trivy — scan eureka (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-eureka:${{ needs.detect.outputs.image_tag }}"
          format: sarif
          output: trivy-eureka.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy SARIF — eureka
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-eureka.sarif
          category: trivy-eureka
        continue-on-error: true
      - name: Trivy — rapport console eureka
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-eureka:${{ needs.detect.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ── api-gateway ────────────────────────────────────────────────
  build-gateway:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.gateway == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push api-gateway
        run: |
          TAG=${{ needs.detect.outputs.image_tag }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/plateforme-gateway:$TAG ./services/api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/plateforme-gateway:$TAG
          echo "✔ plateforme-gateway:$TAG poussé"
      - name: Trivy — scan gateway (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-gateway:${{ needs.detect.outputs.image_tag }}"
          format: sarif
          output: trivy-gateway.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy SARIF — gateway
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-gateway
        continue-on-error: true
      - name: Trivy — rapport console gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-gateway:${{ needs.detect.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ── invoice-service ────────────────────────────────────────────
  build-invoice:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.invoice == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push invoice-service
        run: |
          TAG=${{ needs.detect.outputs.image_tag }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/plateforme-invoice:$TAG ./services/invoice-service
          docker push ${{ secrets.DOCKER_USERNAME }}/plateforme-invoice:$TAG
      - name: Trivy — scan invoice (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-invoice:${{ needs.detect.outputs.image_tag }}"
          format: sarif
          output: trivy-invoice.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy SARIF — invoice
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-invoice.sarif
          category: trivy-invoice
        continue-on-error: true
      - name: Trivy — rapport console invoice
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-invoice:${{ needs.detect.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ── payment-service ────────────────────────────────────────────
  build-payment:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.payment == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push payment-service
        run: |
          TAG=${{ needs.detect.outputs.image_tag }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/plateforme-payment:$TAG ./services/payment-service
          docker push ${{ secrets.DOCKER_USERNAME }}/plateforme-payment:$TAG
      - name: Trivy — scan payment (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-payment:${{ needs.detect.outputs.image_tag }}"
          format: sarif
          output: trivy-payment.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload Trivy SARIF — payment
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-payment.sarif
          category: trivy-payment
        continue-on-error: true
      - name: Trivy — rapport console payment
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/plateforme-payment:${{ needs.detect.outputs.image_tag }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ── subscription-service ───────────────────────────────────────
  build-subscription:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.subscription == 'true'
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build & Push subscription-service
        run: |
