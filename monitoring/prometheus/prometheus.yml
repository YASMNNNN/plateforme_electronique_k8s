global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "plateforme-electronique"

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["plateforme-gateway:8080"]

  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["plateforme-userauth:8081"]

  - job_name: "payment-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["plateforme-payment:8080"]

  - job_name: "invoice-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["plateforme-invoice:8082"]

  - job_name: "subscription-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["plateforme-subscription:8083"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["plateforme-notification:8085"]
